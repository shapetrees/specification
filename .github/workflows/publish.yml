# Build the bikeshed sources and publish them to GitHub Pages.
#
# The rendered spec is served at https://shapetrees.github.io/specification/,
# which https://w3id.org/shapetrees/TR/specification/ redirects to.

name: publish specification

on:
  push:
    branches: [ main ]
  # allow a manual re-publish from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install bikeshed
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade bikeshed
          bikeshed update

      - name: generate html
        run: |
          mkdir -p _site
          for src in *.bs; do
            bikeshed spec "$src" "_site/${src%.bs}.html"
          done

      - name: stage supporting files
        # the vocabulary, schema and examples the spec links to
        run: |
          cp shapetrees.ttl shapetrees-schema.shex _site/
          cp -r snippets _site/

      - name: list contents
        run: find _site -type f | sort

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
